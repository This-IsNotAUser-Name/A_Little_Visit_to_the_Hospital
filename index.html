<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slides</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Icon library (invisible). The decorations on the slides are drawn from these. -->
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">

    <symbol id="i-cross" viewBox="0 0 64 64">
      <path d="M25 9h14v16h16v14H39v16H25V39H9V25h16z" fill="currentColor"/>
    </symbol>

    <symbol id="i-heart" viewBox="0 0 64 64">
      <path d="M32 55C13 41 8 31 8 22.5 8 15 13.5 10 20 10c4.8 0 9.2 2.700 12 7 2.800-4.300 7.200-7 12-7 6.500 0 12 5 12 12.500C56 31 51 41 32 55z" fill="currentColor"/>
    </symbol>

    <symbol id="i-pulse" viewBox="0 0 64 64">
      <path d="M32 55C13 41 8 31 8 22.5 8 15 13.5 10 20 10c4.8 0 9.2 2.700 12 7 2.800-4.300 7.200-7 12-7 6.500 0 12 5 12 12.500C56 31 51 41 32 55z"/>
      <path d="M16 33h8l4-8 6 15 4-7h8"/>
    </symbol>

    <symbol id="i-pill" viewBox="0 0 64 64">
      <g transform="rotate(-35 32 32)">
        <rect x="4" y="21" width="56" height="22" rx="11"/>
        <path d="M32 21v22"/>
        <path d="M15 21H32V43H15A11 11 0 0 1 15 21Z" fill="currentColor"/>
      </g>
    </symbol>

    <symbol id="i-tablet" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="20"/>
      <path d="M17 32h30"/>
    </symbol>

    <symbol id="i-bandage" viewBox="0 0 64 64">
      <g transform="rotate(-40 32 32)">
        <rect x="4" y="21" width="56" height="22" rx="11"/>
        <rect x="22" y="21" width="20" height="22"/>
        <circle cx="28" cy="28" r="1.500" fill="currentColor"/>
        <circle cx="36" cy="28" r="1.500" fill="currentColor"/>
        <circle cx="32" cy="36" r="1.500" fill="currentColor"/>
      </g>
    </symbol>

    <symbol id="i-stethoscope" viewBox="0 0 64 64">
      <path d="M16 8v16a16 16 0 0 0 32 0V8"/>
      <circle cx="16" cy="8" r="2.500" fill="currentColor"/>
      <circle cx="48" cy="8" r="2.500" fill="currentColor"/>
      <path d="M32 40v7a10 10 0 0 0 20 0v-3"/>
      <circle cx="52" cy="38.500" r="5.500"/>
    </symbol>

    <symbol id="i-thermometer" viewBox="0 0 64 64">
      <path d="M25 38V14a7 7 0 0 1 14 0v24a12 12 0 1 1-14 0z"/>
      <circle cx="32" cy="48" r="5" fill="currentColor"/>
      <path d="M32 48V24"/>
    </symbol>

    <symbol id="i-syringe" viewBox="0 0 64 64">
      <g transform="rotate(45 32 32)">
        <rect x="22" y="18" width="20" height="28" rx="3"/>
        <path d="M32 18V6"/>
        <path d="M32 46v8M24 54h16"/>
        <path d="M22 26h6M22 32h6M22 38h6"/>
      </g>
    </symbol>

    <!-- A generic teddy bear (solid shape with the face cut out) -->
    <symbol id="i-bear" viewBox="0 0 64 64">
      <mask id="bear-mask">
        <rect width="64" height="64" fill="#fff"/>
        <circle cx="18" cy="13" r="3.500" fill="#000"/>
        <circle cx="46" cy="13" r="3.500" fill="#000"/>
        <circle cx="26" cy="24" r="2.400" fill="#000"/>
        <circle cx="38" cy="24" r="2.400" fill="#000"/>
        <ellipse cx="32" cy="32" rx="6.500" ry="5" fill="#000"/>
        <circle cx="32" cy="30" r="2" fill="#fff"/>
      </mask>
      <g mask="url(#bear-mask)" fill="currentColor" stroke="none">
        <circle cx="18" cy="13" r="7.500"/>
        <circle cx="46" cy="13" r="7.500"/>
        <circle cx="32" cy="26" r="16"/>
        <ellipse cx="32" cy="50" rx="18" ry="14"/>
      </g>
    </symbol>

    <!-- A wide heartbeat line -->
    <symbol id="i-ecg" viewBox="0 0 400 60" preserveAspectRatio="none">
      <path d="M0 34H60l8-6 8 6h10l7-24 11 48 9-24h12l7-8 7 8H260l8-6 8 6h10l7-24 11 48 9-24h12l7-8 7 8H400" vector-effect="non-scaling-stroke"/>
    </symbol>

  </svg>

  <main id="deck">

    <!-- One slide is shown at a time. app.js fills it from slides.js -->
    <section id="slide" class="slide">
      <div class="photo">
        <div class="photo-bg" id="photo-bg"></div>
        <img id="photo-img" alt="">
      </div>

      <div class="caption">
        <div class="deco-layer" id="deco-layer" aria-hidden="true"></div>
        <div class="caption-text">
          <h2 id="slide-title"></h2>
          <p id="slide-text"></p>
        </div>
      </div>
    </section>

    <nav class="controls">
      <button id="prev" class="nav-btn" aria-label="Previous slide">←</button>
      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      <button id="next" class="nav-btn" aria-label="Next slide">→</button>
    </nav>

  </main>

  <!-- slides.js = your content (edit this one!) -->
  <!-- app.js    = the logic (no need to edit) -->
  <script src="slides.js"></script>
  <script src="app.js"></script>
</body>
</html>
